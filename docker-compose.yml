version: "3.9"

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     user
      POSTGRES_PASSWORD: password
      POSTGRES_DB:       docrouting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d docrouting"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:              postgresql://user:password@db:5432/docrouting
      GEMINI_API_KEY:            ${GEMINI_API_KEY}
      ALLOWED_ORIGINS:           http://localhost:5173
      UPLOAD_DIR:                /uploads
      MAX_FILE_SIZE_MB:          "10"
      # Optional: LangSmith tracing
      # LANGCHAIN_TRACING_V2:    "true"
      # LANGCHAIN_API_KEY:       ${LANGCHAIN_API_KEY}
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app

volumes:
  pgdata:
  uploads:
